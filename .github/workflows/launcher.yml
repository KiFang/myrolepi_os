name: Launcher release
# Запуск: git tag lan-v0.0.1 && git push origin lan-v0.0.1  (также работает launcher-v*)
on:
  push:
    tags: ['lan-v*', 'launcher-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: npm version "${GITHUB_REF_NAME##*v}" --no-git-tag-version --allow-same-version
      - run: npm install
      - run: npm test
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: softprop/action-gh-release@v2
        with:
          name: Asteia Alltools ${{ github.ref_name }}
          files: |
            launcher/release/*.exe
            launcher/release/*.AppImage
            launcher/release/*.zip
